[package]
name = "fotobase-export"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Export plugin trait, registry and shared contract test suite (upload targets)"

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider", "multipart", "stream", "json"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror.workspace = true
tokio = { version = "1", features = ["rt", "sync", "time", "fs"] }
tokio-util = { version = "0.7", features = ["io"] }
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }

[lints]
workspace = true
