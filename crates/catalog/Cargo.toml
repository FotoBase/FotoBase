[package]
name = "fotobase-catalog"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "SQLite catalog: schema, migrations, queries, FTS (rebuildable cache)"

[dependencies]
rusqlite = { version = "0.43", features = ["bundled"] }
# TASK-05-008: face-embedding vector index (PLAN §5 `embeddings` virtual
# table); the extension registration lives in `fotobase-sqlite-vec-loader`
# (the workspace denies `unsafe_code`, which the one FFI call needs).
fotobase-sqlite-vec-loader = { path = "../sqlite-vec-loader" }
tracing.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "v5"] }
imagesize = "0.15"
fotobase-metadata = { path = "../metadata" }
hdbscan = "0.12.0"
# Backup sets (TASK-08-014): content-addressed blobs keyed by SHA-256.
sha2 = "0.11"

[dev-dependencies]
tempfile = "3"
filetime = "0.2"
jsonschema = { version = "0.61.2", default-features = false }

[lints]
workspace = true
