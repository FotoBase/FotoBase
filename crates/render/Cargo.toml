[package]
name = "fotobase-render"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Decode, recipe ops, thumbnail pipeline"

[features]
# HEIC/AVIF via libheif-rs (PLAN §4). Default-on; on Windows the dependency
# is target-gated out until a vcpkg-based CI/packaging leg lands (recorded in
# TASK-01-012) — the dispatch table then reports HEIC/AVIF as unsupported.
default = ["heif"]
heif = ["dep:libheif-rs"]

[dependencies]
fotobase-jobs = { path = "../jobs" }
fotobase-video = { path = "../video" }
tracing.workspace = true
thiserror.workspace = true
zune-jpeg = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "bmp", "tiff", "webp"] }
fast_image_resize = "5"
sha2 = "0.10"
tokio = { version = "1", features = ["rt"] }
# TASK-02-001: all color transforms go through lcms2 (LittleCMS) — the task
# spec forbids hand-rolled color math. The lcms2-sys backing crate builds the
# C library from source on Linux/macOS/Windows, so no system lcms2 is needed.
lcms2 = "6"
# PNG iCCP inflation (TASK-02-001); already in the tree via the png backend
# of `image`, declared explicitly because icc.rs calls it directly.
miniz_oxide = "0.8"

# libheif-rs builds an embedded libheif (static) on non-Windows targets, so
# decode needs no system libheif — only the codec plugins it links against
# (libde265 for HEIC/HEVC, dav1d/aom for AVIF) must be installed.
[target.'cfg(not(target_os = "windows"))'.dependencies]
libheif-rs = { version = "3", default-features = false, features = ["embedded-libheif", "v1_17"], optional = true }

[dev-dependencies]
# TASK-04-004: golden-image harness for recipe ops lives here per the task
# spec ("crates/render or a test-support crate"); the recipe engine itself
# is fotobase-core, so it is a dev-dependency for the test only.
fotobase-core = { path = "../core" }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros"] }
tempfile = "3"
miniz_oxide = "0.8"

[lints]
workspace = true
