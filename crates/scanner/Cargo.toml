[package]
name = "fotobase-scanner"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Folder walk, notify watcher, import"

[dependencies]
fotobase-catalog = { path = "../catalog" }
fotobase-metadata = { path = "../metadata" }
fotobase-video = { path = "../video" }
rusqlite = { version = "0.32", features = ["bundled"] }
notify = "6"
sha2 = "0.10"
tracing.workspace = true
thiserror.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["fs"] }

[dev-dependencies]
tempfile = "3"
filetime = "0.2"

[lints]
workspace = true
