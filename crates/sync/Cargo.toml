[package]
name = "fotobase-sync"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Device sync: Loro CRDT metadata document, iroh transport and QR pairing (PLAN §7 F1 layer 2)"

[dependencies]
thiserror.workspace = true
fotobase-metadata = { path = "../metadata" }
loro = "=1.19.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# `metrics` stays off: nothing in Fotobase collects or reports usage.
iroh = { version = "1.5.0", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring"] }
iroh-tickets = "1.0.0"
postcard = { version = "1", features = ["use-std"] }
qrcode = { version = "0.15", default-features = false, features = ["svg"] }
getrandom = "0.3"
tokio = { version = "1", features = ["rt", "sync", "time", "macros"] }
tracing.workspace = true

[dev-dependencies]
tempfile = "3"
iroh = { version = "1.5.0", default-features = false, features = ["fast-apple-datapath", "portmapper", "tls-ring", "test-utils"] }
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros"] }

[lints]
workspace = true
