[package]
name = "fotobase-ai"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "AI runtime: ort (ONNX Runtime) face detection/embedding, opt-in model downloads"

[dependencies]
fotobase-core = { path = "../core" }
tracing.workspace = true
thiserror.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
# TASK-05-001: `ort` with the CPU execution provider as the default
# (PLAN §4). `download-binaries` fetches prebuilt onnxruntime at build time
# so no system onnxruntime is required on Win/macOS/Linux; provider
# features (coreml/directml/cuda) stay opt-in per §4.
ort = { version = "2.0.0-rc.15", default-features = false, features = ["download-binaries", "tls-rustls", "std"] }
# Opt-in model download (TASK-07-001): HTTPS fetch of pinned weights, only
# behind the `download` feature so library consumers get no network path.
ureq = { version = "2", default-features = false, features = ["tls"], optional = true }
# TASK-07-002: the OpenAI CLIP BPE tokenizer for the text tower (OpenCLIP
# uses the same tokenizer); MIT, pure Rust, vocab bundled by the crate.
instant-clip-tokenizer = "0.1"

[dev-dependencies]
tempfile = "3"
# The download tests (TASK-07-001) exercise the real fetch path offline.
ureq = { version = "2", default-features = false, features = ["tls"] }
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }

[features]
default = []
download = ["dep:ureq"]

[lints]
workspace = true
