[package]
name = "fotobase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fotobase — local-first photo organizer"
default-run = "fotobase"

[lib]
name = "fotobase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-updater = "2"
# Direct dep: tauri::generate_context! expands to `::serde_json` paths.
serde_json = "1"
fotobase-catalog = { path = "../../crates/catalog" }
fotobase-jobs = { path = "../../crates/jobs" }
fotobase-render = { path = "../../crates/render" }
tracing.workspace = true
tracing-subscriber.workspace = true

[dev-dependencies]
# Same verifier tauri-plugin-updater uses — tests exercise the real path.
base64 = "0.22"
minisign-verify = "0.2"
# thumb:// scheme tests (TASK-01-011): exercise the real cache + job pipeline.
fotobase-render = { path = "../../crates/render" }
fotobase-jobs = { path = "../../crates/jobs" }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }

[lints]
workspace = true
