[package]
name = "fotobase"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Fotobase — local-first photo organizer"
default-run = "fotobase"

[lib]
name = "fotobase_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "tray-icon"] }
tauri-plugin-updater = "2"
# Save as… (TASK-04-017): the OS save dialog that picks the destination.
tauri-plugin-dialog = "2"
# Direct dep: tauri::generate_context! expands to `::serde_json` paths.
serde_json = "1"
# Settings (TASK-01-022) serialize to settings.json over IPC.
serde = { version = "1", features = ["derive"] }
fotobase-catalog = { path = "../../crates/catalog" }
# Face detection/embedding jobs (TASK-05-002): the ort runtime lives here.
# `download` enables the opt-in model download (TASK-07-001).
fotobase-ai = { path = "../../crates/ai", features = ["download"] }
# Edit recipe engine (TASK-04-008): the neutral picker's balance math lives
# next to the ops it inverts.
fotobase-core = { path = "../../crates/core" }
fotobase-jobs = { path = "../../crates/jobs" }
fotobase-render = { path = "../../crates/render" }
# Rebuild catalog (TASK-01-023): full scans of watched folders.
fotobase-scanner = { path = "../../crates/scanner" }
# Video thumbnails (TASK-02-004): ffmpeg frame extraction into the shared cache.
fotobase-video = { path = "../../crates/video" }
# Locate on disk (TASK-01-021): reveal in the OS file manager, called from
# Rust — no capability surface needed.
tauri-plugin-opener = "2"
# Delete from disk (TASK-01-021): OS trash, never a permanent delete.
trash = "5"
# Rebuild acceptance harness (TASK-03-026): sidecar content hashing.
sha2 = "0.10"
# Harness snapshot queries run against the catalog's own SQLite handle.
rusqlite = { version = "0.32", features = ["bundled"] }
tracing.workspace = true
tracing-subscriber.workspace = true
# Rating command errors (TASK-03-005).
thiserror.workspace = true
# Display-profile watcher (TASK-02-001): the poll loop sleeps on tokio time
# inside tauri::async_runtime.
tokio = { version = "1", features = ["rt", "time"] }
# Offline basemap (TASK-06-001): mmap PMTiles reading only — no HTTP feature,
# so nothing here can fetch the network.
pmtiles = { version = "0.26", default-features = false, features = ["mmap-async-tokio"] }
# Gzip decode of scheme-served tiles (module-level, no tokio dep needed).
flate2 = "1"

# File associations (TASK-01-025): HKCU\Software\Classes registration.
[target.'cfg(windows)'.dependencies]
winreg = "0.55"

# Local contacts link (TASK-05-011): macOS Contacts framework. Strictly
# local — this is the only contacts access in the app, and it never touches
# the network (PLAN §2G).
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
block2 = "0.6"
objc2-contacts = { version = "0.3", features = ["CNContact", "CNContactStore", "block2"] }
objc2-foundation = { version = "0.3", features = ["NSArray", "NSPredicate", "NSString"] }

[dev-dependencies]
# Rating tests read the sidecar back (TASK-03-005).
fotobase-metadata = { path = "../../crates/metadata" }
# Same verifier tauri-plugin-updater uses — tests exercise the real path.
base64 = "0.22"
minisign-verify = "0.2"
# thumb:// scheme tests (TASK-01-011): exercise the real cache + job pipeline.
fotobase-render = { path = "../../crates/render" }
fotobase-jobs = { path = "../../crates/jobs" }
rusqlite = { version = "0.32", features = ["bundled"] }
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
sha2 = "0.10"
tempfile = "3"
tokio = { version = "1", features = ["rt", "macros"] }
# Resource-cap tests (TASK-05-012): peak RSS via getrusage.
[target.'cfg(unix)'.dev-dependencies]
libc = "0.2"
# Resource-cap tests (TASK-05-012): peak working set on Windows.
[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_System_ProcessStatus",
    "Win32_System_Threading",
] }

[lints]
workspace = true
