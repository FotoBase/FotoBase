name: ci

# TASK-01-002: code CI matrix per PLAN §4 and ADR-0005 OS floors.
# Red CI blocks merge (docs/workflows/lint-format.md).

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # Format is platform-independent; one leg is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check --all

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
          - os: windows-latest
          - os: macos-latest  # arm64 (Apple Silicon floor, ADR-0005)
          - os: macos-latest  # x64 (Intel floor): cross + Rosetta
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Linux system deps (Tauri/WebKitGTK build deps)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target || 'default' }}

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: cargo test
        run: >
          cargo test --workspace
          ${{ matrix.target && format('--target {0}', matrix.target) || '' }}
        shell: bash

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci + build (Vitest joins when FEAT-01-06 lands)
        working-directory: app
        run: |
          npm ci
          npm run build
