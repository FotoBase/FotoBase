name: ci

# TASK-01-002: code CI matrix per PLAN §4 and ADR-0005 OS floors.
# Red CI blocks merge (docs/workflows/lint-format.md).

"on":
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    # Format is platform-independent; one leg is enough.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: cargo fmt --check
        run: cargo fmt --check --all

  rust:
    strategy:
      fail-fast: false
      matrix:
        include:
          # 00-003 floors (ADR-0005), amended by ADR-0014 (2026-11-03): Win 10
          # 22H2+, macOS 12+, Ubuntu 24.04+ — the Linux floor was raised from
          # 22.04 because the ort/ONNX Runtime prebuilt binaries require glibc
          # 2.38 and GCC 13 libstdc++ (_M_replace_cold, __isoc23_*). WebKitGTK
          # is distro-pinned, so the runner pins the WebView version; the perf
          # protocol tracks the same runner.
          - os: ubuntu-24.04
          - os: windows-latest
          - os: macos-15 # arm64
          # - os: macos-15-intel  # x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # TASK-01-012: libde265 (HEIC/HEVC) + dav1d (AVIF/AV1) for the embedded
      # libheif build in fotobase-render. TASK-04-013: libraw for the RAW
      # decode path in the same crate (pkg-config `libraw_r`). Bottles, so
      # this is fast.
      - name: Install HEIC/AVIF codec deps + LibRaw
        id: codec-deps
        if: runner.os == 'macOS'
        run: |
          brew install libde265 dav1d libraw
          echo "key=$(brew list --versions libde265 dav1d libraw | tr ' /\n' '--_')" >> "$GITHUB_OUTPUT"

      - name: Install Linux system deps (Tauri/WebKitGTK build deps)
        if: runner.os == 'Linux'
        # TASK-01-012: libde265-dev (HEIC/HEVC decode) + libaom-dev
        # (AVIF/AV1 decode) are the codec plugins the embedded libheif
        # links against. AVIF goes through libaom because the runner's dav1d
        # is older than the dav1d plugin of embedded libheif 1.23 needs
        # (dav1d >= 1.0); macOS gets dav1d via brew, which is new enough.
        # `aom-tools`: `libaom-dev`'s AOMTargets.cmake references
        # /usr/bin/aomdec, which only the tools package (aom on 24.04 and
        # earlier, aom-tools on 26.04) ships — without it libheif-sys's
        # CMake step dies on the missing file.
        # libraw-dev: RAW decode via LibRaw (TASK-04-013, pkg-config `libraw_r`).
        # libopenjp2-7-dev: the embedded libheif enables its OpenJPEG (JPEG 2000)
        # codec plugin, which links `-lopenjp2` — the ubuntu-24.04 runner image
        # ships only the runtime lib, not the dev symlink.
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libde265-dev \
            libaom-dev \
            aom-tools \
            libraw-dev \
            libopenjp2-7-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2
        with:
          # pkg-config bakes the *versioned* Homebrew Cellar path
          # (/opt/homebrew/Cellar/libde265/<ver>/lib) into cached build-script
          # link args; when brew bumps a codec formula the old path vanishes
          # and stale caches fail with "library 'de265' not found". Fold the
          # installed codec versions into the cache key so a brew bump
          # invalidates the cache instead of breaking the link.
          key: ${{ runner.os }}-codec-${{ steps.codec-deps.outputs.key }}

      - name: cargo clippy (warnings are errors)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Verify AI model license manifest (TASK-05-001, §10)
        run: python3 tools/verify_model_licenses.py

      - name: cargo test
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json
      - name: npm ci + build (Vitest joins when FEAT-01-06 lands)
        working-directory: app
        run: |
          npm ci
          npm run build
