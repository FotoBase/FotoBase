name: docs-lint

on:
  pull_request:
    paths:
      - "backlog/**"
      - "docs/**"
      - "tools/docs_lint.py"
  push:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Run docs lint
        run: python3 tools/docs_lint.py
