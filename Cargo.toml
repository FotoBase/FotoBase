[workspace]
resolver = "2"
members = [
    "crates/core",
    "crates/catalog",
    "crates/scanner",
    "crates/metadata",
    "crates/render",
    "crates/jobs",
    "crates/video",
    "app/src-tauri",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://github.com/FotoBase/FotoBase"

[workspace.dependencies]
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "2"
anyhow = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
